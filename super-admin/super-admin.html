<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="super-admin.css">
    
    
    <header class="header">
        <div class="logo-custom float-start link-div" onclick="window.location.href='#'";>
            <img src="images/la wen.png" alt="Company Logo">
        </div>
        
        <div class="menu-item">Logout</div>
    </header>
   
    <body style=" background-color: rgba(221, 225, 225, 0.5);">
    
                <div class="sidebar">
                    <ul>
                        
                        <li><a href="#" id="dashboard_tab"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                        <li><a href="#" id="chalets_tab"><i class="fas fa-home"></i> Chalets</a></li>
                        <li><a href="#" id="users_tab"><i class="fas fa-user""></i> Users</a></li>
                    </ul>
                </div>

                <div id="dashboard_div" style="display:''" class="row flex-lg-nowrap">
                    <div class="col mb-3">
                        <div class="e-panel card">
                            <div class="chart-container">
                                <div class="circle-board">
                                    <canvas id="costChart"></canvas>
                                </div>

                                <div class="rectangle-board">
                                    <canvas id="ageChart"></canvas>

                                    <div class="rectangle2-board">
                                        <canvas id="chaletCountChart"></canvas>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>

                <div id="chalets_div" style="display:none" class="row flex-lg-nowrap">
                    <div class="col mb-3">
                        <div class="e-panel card">
                            <div class="card-body">
                                <div class="card-title">
                                    <div class="right-end">
                                        <button id="button1" class="buttonuser">New Chalet</button>
                                    </div>
                                    <h6 class="mr-2" style="padding: 15px"><span>Chalets_Info</span></h6>
                                </div>
                                <div class="e-table">
                                    <div class="table-responsive table-lg mt-3">
                                        <input id="searchInput" class="form-control" type="text" placeholder="Search by Name or Location">
                                        <table id="chalets_table" class="table table-bordered">
                                            <thead>
                                                <tr>
                                                    <th class="max-width">Name</th>
                                                    <th>Location</th>
                                                    <th class="sortable">Date</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <!-- Table rows will be dynamically inserted here -->
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="d-flex justify-content-center mt-3">
                                        <ul id="pagination" class="pagination">
                                            <!-- Pagination links will be dynamically inserted here -->
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                   

                    <div id="CreateChalet" style="display: none; ">
                        
                        <div class="modal-dialog modal-lg" role="document" ">
                            <div class="modal-content" >
                                <div class="modal-header" >
                                    <h5 class="modal-title">Create Chalet</h5>
                                    <button type="button" onclick="closeEditDiv('CreateChalet')" class="close" id="close1">
                                        <span aria-hidden="true">×</span>
                                    </button>
                                </div>
                                <div class="modal-body">
                                    <form class="form" id="createChaletForm" onsubmit="return createChalet()">
                                        <div class="row">
                                            <div class="col"><div class="form-group" >
                                                <label>Chalet Name</label>
                                                <input class="form-control" type="text" name="name" placeholder="Your Chalet Name" required>
                                            </div></div>
                                            <div class="col"><div class="form-group">
                                                <label>Location</label>
                                                <input class="form-control" type="text" name="Location" placeholder="Location" required>
                                            </div></div>
                                        </div>
                                        
                                        <div class="row">
                                            <div class="col"><div class="form-group">
                                                <label>Price</label>
                                                <input class="form-control" type="number" placeholder="example : 200$" name="price" min="0"  required>
                                            </div></div>
                                            <div class="col"><div class="form-group">
                                                <label>Owner_Id</label>
                                                <input class="form-control" type="number"  name="Owner_Id" min="2" placeholder="Chalet owner id"  required>
                                                
                                            </div></div>
                                        </div>
                                        
                                        
                                        
                                        <span id="message1"></span>
                                        <div class="form-group">
                                            <label>Date</label>
                                            <input class="form-control" name="date" type="date" id="date1" required>
                                        </div>
                                        <div class="form-group">
                                            <button class="btn btn-primary" style="align-items: right;" type="submit">Save</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="Edit" class="edit-div" style="display: none;">
                      
                        <div class="modal-dialog modal-lg" role="document">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h5 class="modal-title">Edit Chalet</h5>
                                    <button type="button" onclick="closeEditDiv('Edit')"  class="close close-edit-div"  >
                                        <span  aria-hidden="true">×</span>
                                    </button>
                                </div>
                                <div class="modal-body">
                                    <form class="form" id="registrationForm2" onsubmit="return update()">
                                            <div class="row">
                                                <input type="hidden" id="chaletId" name="chaletId" value="">
                                                <div class="col"><div class="form-group" >
                                                    <label>Chalet Name</label>
                                                    <input class="form-control" type="text" name="name" placeholder="Your Chalet Name" required>
                                                </div></div>
                                                <div class="col"><div class="form-group">
                                                    <label>Location</label>
                                                    <input class="form-control" type="text" name="Location" placeholder="Location" required>
                                                </div></div>
                                            </div>
                                            <div class="row">
                                                <div class="col"><div class="form-group">
                                                    <label>Price</label>
                                                    <input class="form-control" type="text" placeholder="" name="price"  required>
                                                </div></div>
                                                <div class="col"><div class="form-group">
                                                    <label>Owner_Id</label>
                                                    <input class="form-control" type="number" placeholder="" name="Owner_Id"  required>
                                                    
                                                </div></div>
                                            </div>
                                            
                                            
                                            
                                            <span id="message2"></span>
                                            <div class="form-group">
                                                <label>Date</label>
                                                <input class="form-control"  type="date" id="date2" required>
                                            </div>
                                            <div class="form-group">
                                                <button class="btn btn-primary" y type="submit">Save</button>
                                            </div>
                                        </form>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>


                <!-- User Management Section -->
                <div id="users_div" style="display: none;" class="row flex-lg-nowrap">
                    <div class="col mb-3">
                        <div class="e-panel card">
                            <div class="card-body">
                                <input type="text" id="searchInput2" class="form-control search-input" placeholder="Search...">
                                <div class="table-responsive">
                                    <table id="userTable" class="table table-bordered">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>First Name</th>
                                                <th>Last Name</th>
                                                <th>Phone Number</th>
                                                <th>Email</th>
                                                <th>Password</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="userTableBody">
                                            <
                                        </tbody>
                                    </table>
                                </div>
                                <div id="pagination" class="mt-3 text-center">
                                    <nav aria-label="Page navigation example">
                                        <ul class="pagination justify-content-center">
                                           
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            


    
   


        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="super-admin.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    </body>
</html>
