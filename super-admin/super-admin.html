<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="super-admin.css">
</head>
<body style="background-color: rgba(221, 225, 225, 0.5);">
    <header class="header">
        <div class="logo-custom float-start link-div" onclick="window.location.href='#'";>
            <img src="images/la wen.png" alt="Company Logo">
        </div>
        <div class="menu-item" style="cursor: pointer;">Logout</div>
    </header>

    <div id="container">
        <!-- Navigation Tabs -->
        <div id="tabs">
            <button id="chalets_tab">Chalets</button>
            <button id="users_tab">Users</button>
            <button id="dashboard_tab">Dashboard</button>
        </div>
        
        <!-- Chalets Section -->
        <div id="chalets_div">
            <h2>Chalets</h2>
            <div id="chalets_table">
                <!-- Chalets table will be populated dynamically -->
            </div>
            <div id="pagination_chalets">
                <!-- Pagination controls will be added dynamically -->
            </div>
        </div>

        <!-- Users Section -->
        <div id="users_div" style="display: none;">
            <h2>Users</h2>
            <div id="users_table">
                <!-- Users table will be populated dynamically -->
            </div>
            <div id="pagination_users">
                <!-- Pagination controls will be added dynamically -->
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard_div" style="display: none;">
            <h2>Dashboard</h2>
            <div>
                <canvas id="costChart" width="400" height="400"></canvas>
            </div>
            <div>
                <canvas id="ageChart" width="400" height="400"></canvas>
            </div>
            <div>
                <canvas id="chaletCountChart" width="400" height="400"></canvas>
            </div>
        </div>
    </div>

    <!-- Modal for Editing Chalets -->
    <div id="edit_modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Chalet</h2>
            <form id="edit_chalet_form">
                <input type="hidden" id="edit_chalet_id">
                <label for="edit_chalet_name">Name:</label>
                <input type="text" id="edit_chalet_name" required>
                <label for="edit_chalet_location">Location:</label>
                <input type="text" id="edit_chalet_location" required>
                <button type="submit">Update</button>
            </form>
        </div>
    </div>

    <!-- Modal for Editing Users -->
    <div id="edit_user_form_container" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit User</h2>
            <form id="edit_user_form">
                <input type="hidden" id="edit_user_id">
                <label for="edit_user_name">Name:</label>
                <input type="text" id="edit_user_name" required>
                <label for="edit_user_email">Email:</label>
                <input type="email" id="edit_user_email" required>
                <button type="submit">Update</button>
            </form>
        </div>
    </div>

    <script src="super-admin.js"></script> <!-- Include your JavaScript file -->
</body>
</html>
